<!doctype html>
<!--
  하루의 항해 v4(7단계: 소리·휴식 버튼을 시간 계획 카드로 이동, 고급 테마·명대사 시스템 리뉴얼) — 이 파일 하나가 앱입니다. harbor.html 로 저장 후 더블클릭.
  [클라우드 동기화 - 선택] Supabase를 연결하면 같은 계정으로 폰·패드·노트북의 데이터를 동기화할 수 있습니다.
  SQL은 함께 제공하는 supabase.sql을 Supabase SQL Editor에서 1회 실행하고, [설정]에 Project URL + anon key를 입력한 뒤 같은 이메일/비밀번호로 로그인하세요.
  ※ anon key는 브라우저에 넣어 사용하는 공개용 키입니다. service_role 키는 절대 넣지 마세요.
-->

.sndbtn,.rbtn{width:36px;height:36px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:17px;line-height:1;display:inline-grid;place-items:center;padding:0;flex:none}
.sndbtn:hover,.rbtn:hover{background:#fff}
.sndtop{display:none}
.tpbtn{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tphint{margin-top:2px}
.restpill{display:inline-flex;align-items:center;gap:8px;padding:2px 3px 2px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.restpill .btn{padding:5px 11px;font-size:12px;border-radius:99px}
.restpill::before{content:"🛋️";font-size:15px}
/* ---- 일간 상단: 한마디 + 주간 메모 한 카드 ---- */
.card.hero{padding:0;overflow:hidden}
.hero .notecard{padding:14px 18px 14px 16px;display:flex;align-items:center;gap:8px}
.hero .nq{font-family:Georgia,serif;font-size:34px;line-height:.7;color:var(--accent);opacity:.35;flex:none;padding-top:10px}
.hero .note{flex:1;min-width:0;width:auto}
.hero .wk{border-top:1px solid var(--line);background:var(--wmbg,var(--soft))}
.hero .wk summary{padding:10px 18px;border-radius:0}
.hero .wk summary b{font-size:13px}
.hero .wk summary .wkdate{font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.7);color:var(--muted)}
.hero .wk summary:hover{background:rgba(255,255,255,.35)}
.hero .wk textarea{display:block;width:calc(100% - 36px);margin:0 18px 14px;background:rgba(255,255,255,.8)}
/* ---- 월간 주간 메모: 달력 칸과 구별되는 연한 색 ---- */
.mg .wm textarea{border:1px solid transparent;border-radius:10px;background:var(--wmbg,#f1f3f6);color:var(--text)}
.mg .wm textarea::placeholder{color:var(--muted);opacity:.75}
.mg .wm textarea:focus{background:#fff;border-color:var(--accent)}
.wd.wmh{color:var(--accent);opacity:.75}
.evchip .em{flex:none;font-size:14px;line-height:1}

#themeFx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#themeFx .l{position:absolute;will-change:transform,opacity}
#themeFx .l svg{display:block;width:100%;height:auto;overflow:visible}
#themeFx .glint{position:absolute;left:0;right:0;top:0;height:380px;overflow:hidden;opacity:.65;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);animation:glintO 7s ease-in-out infinite alternate}
#themeFx .glint i{position:absolute;inset:-40px;display:block;will-change:transform}
#themeFx .gA{background:var(--sp) 0 0/260px 180px;animation:glintA 7s ease-in-out infinite alternate}
#themeFx .gB{background:var(--sp) 90px 60px/340px 235px;animation:glintB 7s ease-in-out infinite alternate}
@keyframes glintO{from{opacity:.3}to{opacity:1}}
@keyframes glintA{from{transform:translate3d(0,0,0)}to{transform:translate3d(26px,10px,0)}}
@keyframes glintB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-20px,14px,0)}}
@keyframes fxDrift{from{transform:translate3d(-3vw,0,0)}to{transform:translate3d(4vw,1.5vh,0)}}
@keyframes fxFloat{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-16px,0)}}
@keyframes fxFloatRot{from{transform:translate3d(0,0,0) rotate(-6deg)}to{transform:translate3d(0,-16px,0) rotate(8deg)}}
@keyframes fxSway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@keyframes fxBreath{from{opacity:.5;transform:scale(1)}to{opacity:1;transform:scale(1.05)}}
@keyframes fxPurr{from{transform:scale(1,1)}to{transform:scale(1.015,1.035)}}
@keyframes fxTwinkle{0%,100%{opacity:.2}50%{opacity:.95}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxPaw{0%{opacity:0}12%{opacity:.5}60%{opacity:.5}80%,100%{opacity:0}}
@keyframes fxFall{0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}8%{opacity:.7}92%{opacity:.7}100%{transform:translate3d(-14vw,112vh,0) rotate(260deg);opacity:0}}
@keyframes fxFly{from{transform:translate3d(-16vw,0,0)}to{transform:translate3d(118vw,-3vh,0)}}
@keyframes fxRise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.75}85%{opacity:.75}100%{transform:translate3d(10px,-60vh,0);opacity:0}}
body.nomo #themeFx,body.nomo #themeFx *{animation:none!important;will-change:auto!important}
body.nomo #themeFx .tm{display:none}
@media (prefers-reduced-motion:reduce){#themeFx,#themeFx *{animation:none!important;will-change:auto!important}#themeFx .tm{display:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
.bgphoto{position:fixed;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;opacity:.3;display:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input[type=text],input:not([type]),input[type=date],input[type=time],input[type=number],input[type=password],input[type=file],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%;outline:0}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin:8px 0}label.chk input{width:auto}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:210px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:fixed;left:0;top:0;bottom:0;z-index:2}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin:4px 10px 24px;color:var(--accent)}.logo svg{flex:none}.logo span{color:var(--text)}.logo small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}.nav button{padding:11px 13px;text-align:left;border-radius:11px}.nav button.active{background:var(--soft);font-weight:700}
.logo .brand-mark{width:32px;height:32px;flex:none;display:block}.nav button{display:flex;align-items:center;gap:10px}.nav-ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ico)}.nav-ico svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mobile-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;flex:1}.mobile-nav .nav-ico{width:23px;height:23px}.mobile-nav .nav-ico svg{width:21px;height:21px}.mobile-nav button.active .nav-ico{filter:saturate(1.15)}
.main{margin-left:210px;width:calc(100% - 210px);padding:26px;max-width:1300px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}.title{font-size:25px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
.btn{background:var(--soft);border-radius:10px;padding:8px 13px;font-size:13px}.btn.primary{background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.row>input{flex:1;min-width:110px}
.note{border:0!important;background:transparent!important;font-size:17px;font-weight:600;padding:5px!important}
.notecard{display:flex;align-items:center;gap:12px;padding:12px 16px}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dd{display:inline-flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 10px 5px;border-radius:12px;background:var(--soft);border:1px solid var(--line);line-height:1.15}
.dd b{font-size:15px;color:var(--accent)}.dd small{font-size:10px;color:var(--muted);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd.hot{background:var(--accent);border-color:var(--accent)}.dd.hot b,.dd.hot small{color:#fff}.dd.past b{color:var(--danger)}
.dd.add{flex-direction:row;border-style:dashed;background:none;color:var(--muted);font-size:12px;min-width:0;padding:7px 10px}
.task{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task.grp{background:var(--soft);border-radius:12px;border-bottom:0;margin-top:8px;padding:10px 8px}
.task.grp .taskname{font-weight:800;font-size:16px}
.task.ch{margin-left:34px;padding-left:12px;border-left:3px solid var(--line);font-size:14px}
.task.ch .taskname{font-weight:400}
.task.subadd input{padding:6px 8px}
.fsp{width:18px;flex:none}.fold{font-size:13px}.rp{width:21px;text-align:center;flex:none}
.task.hl-today{background:#ffe3e0;border-radius:10px;padding-left:6px;padding-right:6px}.task.hl-tmr{background:#fff4c2;border-radius:10px;padding-left:6px;padding-right:6px}
.check{width:21px;height:21px;border:1.5px solid #aaa;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;color:#fff}.check.done{background:var(--accent);border-color:var(--accent)}
.taskname{flex:1 1 180px;min-width:120px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere;line-height:1.45}.taskname.done{text-decoration:line-through;color:#aaa}
.pill{font-size:11px;color:#777;background:var(--soft);padding:3px 7px;border-radius:99px;white-space:nowrap;max-width:100%}.pill.soon{color:#a94444;background:#ffe5e3;font-weight:800}.pill.late{color:#a52f35;background:#ffd9d7;font-weight:800}.task .taskname{overflow-wrap:anywhere}.task .ic,.task .star,.task .check{flex:0 0 auto}
.star{font-size:18px;color:#c8c8c8}.star.on{color:#e0a400}
.ic{font-size:14px;opacity:.55;padding:2px 3px}.ic:hover{opacity:1}
.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(320px,1fr) 1.3fr;gap:14px}
.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.pick{max-height:340px;overflow:auto}.pick-entry{display:flex;gap:6px;margin:8px 0}.pick-entry input{min-width:0;flex:1}
.chips{margin-bottom:10px}.chip{background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px}.chip.on{background:var(--accent);color:#fff}.chip.add{border:1px dashed var(--line);background:none;color:var(--muted)}
.qrow{display:flex;gap:10px;align-items:flex-end}.spr{width:48px;height:48px;image-rendering:pixelated;flex:none}
.bub{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:10px 13px;white-space:pre-line;font-size:15px;line-height:1.6;font-weight:600}

};
function applyFx(){
  const el=$('#themeFx');if(!el)return;const th=S.settings.theme;
  if(el.dataset.t===th)return;
  el.dataset.t=th;el.innerHTML=(th!=='sea'&&th!=='none'?'<div class="glint"><i class="gA"></i><i class="gB"></i></div>':'')+(FXB[th]?FXB[th]():'');
}
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d)};
function dueLabel(s){
  const w0=mondayOf(today()),w1=addDays(w0,6),n0=addDays(w0,7),n1=addDays(w0,13),wd=WD[parse(s).getDay()]+'요일';
  if(s>=w0&&s<=w1)return wd;
  if(s>=n0&&s<=n1)return '다음주 '+wd;
  return mmdd(s);
}
const repLabel=a=>a.length===7?'매일':[1,2,3,4,5,6,0].filter(x=>a.includes(x)).map(x=>WD[x]).join('');
const hue=id=>[...String(id)].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const nsize=v=>{let w=0;for(const c of String(v||'')){w+=c.charCodeAt(0)>255?1.9:1.05}return Math.max(12,Math.min(70,Math.ceil(w)+2))};
function readImg(f,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}

/* ============ 데이터 ============ */
const KEY='harbor_planner_v2',SYNC='harbor_sync',QKEY='harbor_quotes_auto',BGK='harbor_bg';
const defaults=()=>({tasks:[],days:{},fixed:[],fx:{},events:[],cats:[],weeks:{},projects:[],ddays:[],repGen:{},order:{},settings:{theme:'clean',startHour:9,endHour:24,fxFrom:'',fxTo:''},updatedAt:0,qhist:[]});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=defaults();Object.assign(d,r);d.settings=Object.assign(defaults().settings,r.settings||{});d.ddays=d.ddays||[];d.cats=d.cats||[];d.weeks=d.weeks||{};return d}}catch(e){}return defaults()}
let S=load();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ 저장 공간이 부족해요. 설정에서 내보내기로 백업한 뒤 사진을 정리해 주세요',null,null,8000)}push()}
const D=d=>{const x=S.days[d]||(S.days[d]={note:'',blocks:[],closed:null});x.blocks=x.blocks||[];return x};
const T=id=>S.tasks.find(t=>t.id===id);
const P=id=>S.projects.find(p=>p.id===id);
const kids=id=>S.tasks.filter(x=>x.parent===id);
function newTask(o){const t=Object.assign({id:uid(),name:'',due:'',star:false,memo:'',done:false,doneAt:null,createdAt:Date.now(),createdDay:today(),days:[],moves:[],scope:'all',proj:'',parent:'',repeat:null,rid:''},o);S.tasks.push(t);return t}
const dayTasks=d=>S.tasks.filter(t=>t.days.includes(d));
function assign(id,d){const t=T(id);if(t&&!t.days.includes(d))t.days.push(d)}
function unassign(id,d){const t=T(id);if(!t)return;t.days=t.days.filter(x=>x!==d);D(d).blocks=D(d).blocks.filter(b=>b.taskId!==id)}
function postpone(id,from,to){unassign(id,from);assign(id,to);T(id).moves.push({from,to,at:Date.now()})}
function setDone(t,v){t.done=v;t.doneAt=v?Date.now():null}
function toggleDone(id){
  const t=T(id);if(!t||t.repeat)return;const v=!t.done;setDone(t,v);
  kids(id).forEach(k=>{if(k.done!==v)setDone(k,v)});
  if(t.parent){const p=T(t.parent);if(p){const ad=kids(p.id).every(k=>k.done);if(p.done!==ad)setDone(p,ad)}}
}
function delTask(id){const ids=new Set([id,...kids(id).map(k=>k.id)]);S.tasks=S.tasks.filter(x=>!ids.has(x.id));Object.values(S.days).forEach(dd=>dd.blocks=(dd.blocks||[]).filter(b=>!ids.has(b.taskId)))}
function rate(d){const ts=dayTasks(d);if(!ts.length)return null;let a=0,b=0;ts.forEach(t=>{const w=t.star?2:1;a+=w;if(t.done)b+=w});return Math.round(b/a*100)}
const recentOk=t=>!t.done||t.doneAt>Date.now()-3*864e5;
const cmpDue=(x,y)=>{const a=x.due||'9999',b=y.due||'9999';return a<b?-1:a>b?1:0};
const sortDay=a=>[...a].sort((x,y)=>(x.done-y.done)||(y.star-x.star)||cmpDue(x,y)||(x.createdAt-y.createdAt));
const sortKids=a=>[...a].sort((x,y)=>(x.done-y.done)||cmpDue(x,y)||(x.createdAt-y.createdAt));
function gKey(t){const ds=[t,...kids(t.id)].filter(x=>!x.done&&x.due).map(x=>x.due).sort();return ds[0]||(t.done?'9999':(t.due||'9999'))}
const sortTop=a=>[...a].sort((x,y)=>(x.done-y.done)||(gKey(x)<gKey(y)?-1:gKey(x)>gKey(y)?1:0)||(x.createdAt-y.createdAt));
const dueCls=d=>d<today()?'late':'soon';
const bTitle=b=>b.taskId&&T(b.taskId)?T(b.taskId).name:(b.title||'일정');

/* 완료 기록은 3일 뒤 자동 삭제 (진행 중인 항로 안의 항목은 항로와 함께 관리) */
function purge(){
  const cut=Date.now()-3*864e5;let ch=false;
  S.projects.filter(p=>p.done&&p.doneAt&&p.doneAt<cut).forEach(p=>{S.tasks.filter(t=>t.proj===p.id).forEach(t=>{if(T(t.id))delTask(t.id)});S.projects=S.projects.filter(x=>x.id!==p.id);ch=true});
  S.tasks.filter(t=>t.done&&t.doneAt&&t.doneAt<cut&&!t.proj&&!t.repeat).forEach(t=>{
    if(!T(t.id))return;const p=t.parent&&T(t.parent);if(p&&!p.done)return;delTask(t.id);ch=true});
  Object.values(S.days).forEach(x=>{if(x&&x.photo){delete x.photo;ch=true}});
  const n=S.ddays.length;S.ddays=S.ddays.filter(x=>!(x.done&&x.doneAt&&x.doneAt<cut));if(S.ddays.length!==n)ch=true;
  const old=addDays(today(),-60);Object.keys(S.repGen).forEach(k=>{if((k.split('|')[1]||'')<old){delete S.repGen[k];ch=true}});
  if(ch)save();
}

/* 반복 할 일 */
function ensureRepeats(d){
  let ch=false;const wd=parse(d).getDay();
  S.tasks.filter(t=>t.repeat&&t.repeat.length).forEach(tpl=>{
    if(d<tpl.createdDay||!tpl.repeat.includes(wd))return;
    const k=tpl.id+'|'+d;if(S.repGen[k])return;
    S.repGen[k]=1;const t=newTask({name:tpl.name,star:tpl.star,memo:tpl.memo,rid:tpl.id,scope:'day'});t.days.push(d);ch=true;
  });
  if(ch)save();
}

/* 고정 일정 */
function fixedFor(d){
  const wd=parse(d).getDay();
  return S.fixed.filter(f=>f.from<=d&&d<=f.to&&f.days.includes(wd)).map(f=>{
    const x=(S.fx[d]||{})[f.id]||{};if(x.hidden)return null;
    return{id:'fx_'+f.id,fid:f.id,title:x.title??f.title,s:x.s??f.s,e:x.e??f.e,fixed:true,unlocked:!!x.unlocked};
  }).filter(Boolean);
}
function fxo(d,fid){S.fx[d]=S.fx[d]||{};return S.fx[d][fid]=S.fx[d][fid]||{}}
const hiddenCount=d=>Object.values(S.fx[d]||{}).filter(x=>x.hidden).length;

/* D-day */
const ddn=x=>dayDiff(today(),x.date);
const ddL=x=>{const n=ddn(x);return n>0?'D-'+n:n===0?'D-Day':'D+'+(-n)};
function ddChips(){
  const f=x=>{const n=ddn(x);return n>=0?n:10000-n};
  const L=ordList('dday',S.ddays.filter(x=>x.show&&!x.done),a=>a.sort((p,q)=>f(p)-f(q)));
  return L.map(x=>{const n=ddn(x);return `<button class="dd ${n===0?'hot':n<0?'past':''}" data-act="ddm"><b>${ddL(x)}</b><small>${esc(x.name)}</small></button>`}).join('')+`<button class="dd add" data-act="ddm">${L.length?'＋':'＋ D-day'}</button>`;
}
function ddayModal(){
  const L=ordList('dday',S.ddays.filter(x=>!x.done),a=>a.sort((p,q)=>p.date<q.date?-1:1));
  modal('🎯 D-day',`<div class="small muted">체크한 D-day가 일간(메인) 화면에 표시돼요. 날짜가 지나도 '완료'를 누르기 전까지는 D+1, D+2…로 계속 보여요.</div>
   ${ORD().dday?`<div style="margin:8px 0"><button class="btn" data-act="resort" data-key="dday" data-re="dd">↕ 기한순으로 다시 정렬</button></div>`:''}${L.map(x=>`<div class="hbrow" data-ok="dday" data-oid="${x.id}" data-re="dd"><span class="hnd">⠿</span><label class="chk" style="margin:0"><input type="checkbox" data-ddshow="${x.id}" ${x.show?'checked':''}></label><span><b>${ddL(x)}</b> ${esc(x.name)} <span class="small muted">${x.date.replace(/-/g,'.')}</span></span><button class="btn" data-act="ddedit" data-id="${x.id}">✎</button><button class="btn" data-act="dddone" data-id="${x.id}">완료</button><button class="ic" data-act="dddel" data-id="${x.id}">🗑</button></div>`).join('')||'<div class="empty">아직 없어요</div>'}
   <div class="row" style="margin-top:12px"><input id="dd_n" placeholder="이름 (예: 기말고사)"><input type="date" id="dd_d" style="width:auto;flex:none"><button class="btn primary" data-act="ddadd">추가</button></div>`,[{t:'닫기',c:'primary'}]);
}

['sanji',['fri'],`네가 할 수 없는 건 내가 한다. 내가 할 수 없는 일을 네가 해라!!!`,'원피스 43권'],

  ["sabo",["adv"],"장남 둘에 동생 하나. 이상하지만 이 인연은 우리의 보물이지. 루피 녀석은 아직 한참 약하고 울보지만, 우리의 동생이야. 잘 부탁한다.","원피스 60권.[83]"],

  ["sabo",["cra"],"그 녀석이··· 어떤 기분으로 이 세상을 떠났는가, 그런 건 그날 이후 밤의 개수만큼 생각했어!!! 네가 굳이 말 안 해도 다 알아!!! 더 이상 후회는 안 해!!!","원피스 79권"],
  ["sabo",["res"],"──··· 그 녀석의 의지는 우리가 이어갈 거야!!!","원피스 73권.[84]"],

  ["dragon",["adv","fri"],"자유를 위해 함께 싸울 의지가 있는 자는, 이 배에 타라!!! (고아 왕국 주민들: 우워어어어어···!!)","원피스 60권"],

  ["dragon",["res"],"일단은··· 사실 확인이다······!!!","원피스 95권.[88][89]"],

  ["dragon",["res"],"생면부지인 당신의 아이들을 난 구하고 싶다!! 그렇지 않으면 난 이곳에 서 있을 수 없어···!!!","원피스 114권.[97][98]"],
  ["dragon",["res","fri"],"(쿠마: 만약 보니의 병이 나으면···!! 다시 함께 싸우고 싶어!!) 운명의 바람이 부는 쪽으로 나아갈 따름이다. 동무여.","원피스 108권"],
  ["dragon",["fri"],"베가펑크······. 네가 목숨을 건 말을 믿은 자들이 모두 평화적으로 ‘준비’하리라는 법은 없다. 결판을 서두르자!!! 그렇지 않으면··· 민중이 ‘안전한 곳’을 서로 빼앗는 세계가 도래할 거다!!!","원피스 111권"],
  ["dragon",["cmf"],"마음이 이끄는 대로 살아라. 루피···. 시대는 때로··· 온갖 우연과 기개를 품고서, 세계에 물음을 던진다!! 우리가 언젠가 만날 날도 올 테지···.","원피스 45권"],

  ["dragon",["res"],"이번 사건은 정말이지 충격이었어!! 법률이라는 이름을 얻은 ‘불합리’를 타일렀을 뿐인 힘없는 학자들이 폭력에 짓밟혔어······!!! 난 싸울 수 있는 군대를 만들겠어!!!","원피스 106권"],

  ["roger",["adv","fri"],"절대로 멈출 수가 없는 것들이 있다. '계승되는 의지', '사람의 꿈', '시대의 일렁임' . ─── 인간이 '자유'의 답을 찾는 한, 그것들은 절대로 멈추지 않는다.","원피스 12권.[109]"],

  ["roger",["fri"],"이 만남은 운명이다! 레일리. ─나와 함께 세계를 발칵 뒤집어보지 않겠나?","원피스 61권.[116]"],
  ["roger",["res","fri"],"애송이! 너는 아직 대기해라! 내 시간에는 한계가 있어! ──알겠지? 사람에게는 반드시 나설 차례란 게 있다!","원피스 87권.[117]"],

  ["roger",["res"],"'약탈'이야말로 해적의 본질!!! 원하는 것은 빼앗으면 그뿐!!! 안 그러냐, 얘들아!!!","원피스 114권.[124]"],

  ["garp",["fri"],"악당에게 동정은 하지 않지만··· 가족은 다르다···! 난 어찌해야 되겠나·········! 에이스, 이 자식······! 왜 내 말대로 살지 않은 거냐?","원피스 57권.[159][160]"],

  ["garp",["res"],"푸왓하하하!! 어이, 해적 놈들~~~~! 너희가 누굴 납치한 건지 아나?!! 코비는 해군의 '미래'! 그리고 나의 애제자다아!!! '갤럭시 임팩트'!","원피스 107권"],

  ["garp",["res"],"일이 어떻게 돌아가는 거야?! 뭐냐고, 저 괴물은!! (해병: 모르겠습니다. 갑자기··· 새턴 성께서 변신을!!) '오로성'인가! 처음 봤어···!! 구더기들의 톱 아니랄까봐 딱 맞는 꼬락서니군.","원피스 114권. 갓 밸리 사건에서 새턴 성에게 빙의한 채로 변신한 이무를 보고 한 대사"],
  ["crocodile",["adv"],"누굴 바다에 처넣는다고?","원피스 56권.[132]"],
  ["crocodile",["adv"],"···애송이, 이 바다의 깊이를 아는 자일수록 그런 경솔한 발언은 함부로 내뱉지 않는 법이다.","원피스 23권.[130]"],
  ["crocodile",["adv","res"],"싸움에 진 개는 정의를 말할 수 없지···!!! 여기는 그런 바다야···!!! 너흰 기지에 돌아가 정의 토론이나 실컷 해대라.","원피스 22권"],
  ["crocodile",["res"],"지금···!! 심기가 불편하다구. 조심해라, 매의 눈.","원피스 58권.[135]"],
  ["crocodile",["res"],"한심하기 이를 데 없잖나!!! '흰 수염'!!! 난 그렇게 '약한 사내'에게 패배한 적은 없다구!!!","원피스 58권.[133]"],

  ["crocodile",["res"],"아무도 죽지 않았으면? ···그런 세상 모르는 멍청한 녀석도 다 있다니···. 진짜 싸움이 뭔지를 모르니까 그렇지.''' 너도 그렇게 생각하지?","원피스 20권"],
  ["crocodile",["fri"],"지키고 싶은 게 있다면 확실하게 지켜!!! 더는 이 자식들의 뜻대로 놀아나지 말라구!!!","원피스 59권.[136]"],
  ["crocodile",["fri"],"모두 다 용서하지, 니코 로빈. 왜냐면 난··· 처음부터 어느 누구도 믿지··· 않았으니까 말야.","원피스 22권.[126]"],

function srcShort(s){
  const m=String(s).match(/^(원피스 \d+[권화]|애니메이션 \d+화|\d+기 극장판 [^中.\[]+|시즌\d+[^.]*)/);
  return m?m[0].trim():'';
}
function parseQuotes(raw){
  const L=raw.split(/\r?\n/).map(l=>l.trim());
  const E=[];let c=null,buf=[];
  const flush=src=>{
    if(!c||!buf.length)return;
    const q=buf.join('\n').replace(/\[[^\]]{0,15}\]/g,'').replace(/[ \t]+\n/g,'\n').trim();
    buf=[];
    if(q)E.push({c,q,s:srcShort(src)});
  };
  for(const l of L){
    if(!l)continue;
    const hm=l.match(/^<([^>]+)>$/);
    if(hm){flush('');c=TXTCHAR[hm[1].trim()]||null;continue}
    if(/^[\d.]+\.\s/.test(l)&&l.length<70)continue;
    if(/^\d+\.\d+\.\s/.test(l))continue;
    if(/^(원피스 \d+권|원피스 \d+화|애니메이션 \d+화|\d+기 극장판|시즌\d+|드라마|원피스 하트 오브 골드)/.test(l)){
      flush(l);continue;
    }
    if(c)buf.push(l);
  }
  flush('');
  const out=[];
  E.forEach((e,i)=>{
    let q=e.q.replace(/\s+/g,' ').trim();
    if(!q||q.length<12||q.length>160) return;
    if(/[\u3040-\u30ff]/.test(q)) return;
    if(/^[^가-힣]*[:：]/.test(q)||/[가-힣]{1,8}[:：]\s/.test(q)) return;
    if((q.match(/\(/g)||[]).length>1||(q.match(/（/g)||[]).length>1) return;
    const cats=Object.keys(CATX).filter(k=>CATX[k].test(q));
    if(!cats.length) return;
    /* 위협·폭력성만 강한 대사는 격려 풀에서 제외하되, 동료/모험/위로 문맥이면 살린다. */
    if(SAFE.test(q)&&!cats.some(k=>['adv','fri','cmf','cra'].includes(k))) return;
    out.push({id:'a'+i,c:e.c,cats,t:q,s:e.s});
  });
  return out;
}

function layout(items){
  const a=[...items].sort((x,y)=>x.s-y.s||x.e-y.e);const out=[];let cl=[],end=0;
  const flush=()=>{if(!cl.length)return;const lanes=[];cl.forEach(it=>{let i=lanes.findIndex(le=>le<=it.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=it.e;it.lane=i});cl.forEach(it=>it.n=lanes.length);out.push(...cl);cl=[]};
  a.forEach(it=>{if(cl.length&&it.s>=end)flush();end=cl.length?Math.max(end,it.e):it.e;cl.push(it)});flush();return out;
}
function gridHTML(d){
  const sh=S.settings.startHour,eh=S.settings.endHour,H=(eh-sh)*72;let lines='';
  for(let h=sh;h<eh;h++)lines+=`<div class="hl" style="top:${(h-sh)*72}px"><span>${pad(h)}:00</span></div>`;
  const items=layout([...fixedFor(d),...((S.days[d]&&S.days[d].blocks)||[]).map(b=>({...b,fixed:false}))].filter(b=>b.e>sh*60&&b.s<eh*60));
  const bl=items.map(b=>{
    const top=(b.s-sh*60)/10*12,h=Math.max(12,(b.e-b.s)/10*12-1),t=b.taskId?T(b.taskId):null;
    const lk=b.fixed&&!b.unlocked;
    return `<div class="blk ${b.fixed?'fx':''} ${lk?'lk':''} ${t&&t.done?'dn':''}" data-id="${b.id}" data-fixed="${b.fixed?1:0}" style="top:${top}px;height:${h}px;left:calc(44px + (100% - 50px) * ${b.lane}/${b.n});width:calc((100% - 50px)/${b.n} - 2px)">${b.fixed?(lk?'🔒 ':'🔓 '):''}${esc(bTitle(b))}<br><span class="small" style="opacity:.7">${tm(b.s)}–${tm(b.e)}</span>${lk?'':'<div class="rs"></div>'}</div>`;
  }).join('');
  let now='';if(d===today()){const m=nowMin();if(m>=sh*60&&m<eh*60)now=`<div class="nowl" style="top:${(m-sh*60)/10*12}px"></div>`}
  return `<div class="grid" data-date="${d}" style="height:${H}px">${lines}${bl}${now}</div>`;
}

/* 일간 화면 상단에 보여줄, 그날에 걸친 월간 일정 */
function deepOf(c){
  let h=0;
  if(c[0]==='#'){const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}}
  else{const m=c.match(/hsl\((\d+)/);h=m?+m[1]:0}
  return `hsl(${Math.round(h)},58%,50%)`;
}
/* 일간 일정칩 이모지: 제목 키워드로 고르고, 없으면 기본값 (빨강 계열 피함) */

function evEmoji(e){const t=e.title||'';for(const [r,m] of EVEMO)if(r.test(t))return m;return (e.end&&e.end>e.date)?'🧭':'✨'}
function evChipsHTML(d){

function evLanes(){

  const le=[];evs.forEach(e=>{let i=le.findIndex(x=>x<e.date);if(i<0){i=le.length;le.push('')}le[i]=e.end;e.lane=i});return evs;
}
function evBar(e,d){

function krHoliday(d){return KR_HOLIDAYS_2026[d]||KR_FIXED_HOLIDAYS[d.slice(5)]||''}
function monthHTML(ym,evs){
  const [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0).getDate(),hu=((y*31+m*97)*53)%360;
  let h=`<div class="mh">${y}년 ${m}월</div><div class="mg"><div class="wd wmh">주간 메모</div>${WD.map(w=>`<div class="wd">${w}</div>`).join('')}`;
  const wm=k=>`<div class="wm"><textarea data-wk="${k}" placeholder="${mmdd(k)} 주 메모" aria-label="${mmdd(k)}부터 한 주 메모">\n${esc(weekMemo(k))}</textarea></div>`;
  h+=wm(weekKey(`${ym}-01`));
  for(let i=0;i<first.getDay();i++)h+='<div></div>';
  for(let n=1;n<=last;n++){
    const d=`${ym}-${pad(n)}`,rt=S.days[d]&&S.days[d].closed?S.days[d].closed.rate:null,cov=evs.filter(e=>e.date<=d&&d<=e.end);
    const bg=rt!=null?`background:hsla(${hu},65%,55%,${(.1+rt/100*.55).toFixed(2)})`:'';
    let bars='';if(cov.length){const mx=Math.max(...cov.map(e=>e.lane));for(let i=0;i<=mx;i++){const e=cov.find(x=>x.lane===i);bars+=e?evBar(e,d):'<div class="ev"></div>'}}
    if(n>1&&parse(d).getDay()===0)h+=wm(d);
    const holiday=krHoliday(d);h+=`<div class="day ${d===today()?'today':''}" data-act="mday" data-d="${d}" style="${bg}"><div class="date-head"><span class="date-num ${holiday?'holiday':''}">${n}</span>${holiday?`<span class="holiday-name" title="${esc(holiday)}">${esc(holiday)}</span>`:''}</div>${rt!=null?`<span class="pt">${rt}%</span>`:''}${bars}${view.showT?dayTasks(d).slice(0,4).map(t=>`<div class="mt ${t.done?'done':''}">${t.done?'☑':'☐'} ${esc(t.name)}</div>`).join('')+(dayTasks(d).length>4?`<div class="mt">+${dayTasks(d).length-4}</div>`:''):''}</div>`;
  }
  return h+'</div>';
}

/* ============ 동작 ============ */
function taskModal(id){
  const t=T(id);if(!t)return;
  TMS={days:t.days.slice().sort(),scope:t.scope};const rep=t.repeat?`<label>반복 요일</label><div class="row">${[1,2,3,4,5,6,0].map(x=>`<label class="small"><input type="checkbox" class="rpd" value="${x}" ${t.repeat.includes(x)?'checked':''} style="width:auto"> ${WD[x]}</label>`).join('')}</div>`:'';
  const info=[];
  if(t.proj&&P(t.proj))info.push('항로: '+esc(P(t.proj).name));
  if(t.parent&&T(t.parent))info.push('상위: '+esc(T(t.parent).name));
  
  if(t.moves.length)info.push('미룬 횟수 '+t.moves.length);
  const btns=[{t:'삭제',c:'danger',f:()=>{if(!confirm(kids(id).length?'하위 항목도 함께 삭제돼요. 삭제할까요?':'삭제할까요?'))return false;const back=snap('tasks','days');delTask(id);save();render();undoToast('🗑 할 일을 삭제했어요',back)}}];
  if(!t.repeat)btns.push({t:'오늘로',f:()=>{assign(id,today());save();render()}});
  btns.push({t:'취소'},{t:'저장',c:'primary',f:m=>{
    t.name=$('#m_n',m).value.trim()||t.name;t.star=$('#m_s',m).checked;t.memo=$('#m_m',m).value;
    if(t.repeat){const r=[...document.querySelectorAll('.rpd:checked')].map(Number);if(r.length)t.repeat=r}
    else{t.due=$('#m_d',m).value;const keep=new Set(TMS?TMS.days:t.days);t.days.slice().forEach(x=>{if(!keep.has(x))unassign(id,x)});const p=$('#m_p',m).value;if(p)assign(id,p);if(t.scope==='day'&&!t.days.length){delTask(id)}}
    save();render()}});
  modal(t.repeat?'🔁 반복 할 일':'할 일',`<label>이름<input id="m_n" value="${esc(t.name)}"></label>${t.repeat?'':`<label>기한<input type="date" id="m_d" value="${t.due||''}"></label><div class="row" style="margin:-2px 0 8px"><button type="button" class="btn" data-act="mdclr">기한 지우기</button><span class="small muted" id="m_dh"></span></div>`}
   <label class="chk"><input type="checkbox" id="m_s" ${t.star?'checked':''}> ★ 중요</label>${rep}<label>메모<textarea id="m_m" rows="4">${esc(t.memo||'')}</textarea></label>
   ${t.repeat?'':`<div class="small muted" style="margin-top:8px">배치된 날 (✕로 하나씩 뺄 수 있어요)</div><div class="row" id="m_days" style="margin:4px 0 6px">${tmDaysHTML()}</div><label>날짜에 배치 추가<input type="date" id="m_p"></label>`}<div class="small muted">${info.join(' · ')}</div>`,btns);
}
function blockModal(d,it){
  if(it.fixed&&!it.unlocked){
    modal('🔒 '+esc(it.title),`<div class="muted">${tm(it.s)} – ${tm(it.e)} · 고정 일정</div><div class="small muted" style="margin-top:8px">오늘만 시간이 바뀌었다면 잠금을 풀어서 고칠 수 있어요. 원래 반복 일정은 그대로예요.</div>`,
     [{t:'이 날만 숨기기',c:'danger',f:()=>{fxo(d,it.fid).hidden=true;save();render()}},{t:'🔓 이 날만 수정',c:'primary',f:()=>{fxo(d,it.fid).unlocked=true;save();render()}},{t:'닫기'}]);return;
  }
  if(it.fixed){
    modal('🔓 고정 일정 (이 날만)',`<label>이름<input id="b_t" value="${esc(it.title)}"></label><label>시작<input type="time" id="b_s" step="300" value="${tm(it.s)}"></label><label>끝<input type="time" id="b_e" step="300" value="${tm(it.e)}"></label>`,
     [{t:'원래대로',f:()=>{delete S.fx[d][it.fid];save();render()}},{t:'이 날만 숨기기',c:'danger',f:()=>{fxo(d,it.fid).hidden=true;save();render()}},
      {t:'저장',c:'primary',f:m=>{const s=toMin($('#b_s',m).value),e=toMin($('#b_e',m).value);if(isNaN(s)||isNaN(e)||e<=s)return false;const o=fxo(d,it.fid);o.title=$('#b_t',m).value.trim()||it.title;o.s=s;o.e=e;o.unlocked=true;save();render()}}]);return;
  }
  const b=D(d).blocks.find(x=>x.id===it.id);if(!b)return;
  modal('시간 블록',`<label>이름<input id="b_t" value="${esc(b.title||'')}" placeholder="${b.taskId&&T(b.taskId)?esc(T(b.taskId).name):'무엇을 할까요?'}"></label>
   <label>시작<input type="time" id="b_s" step="300" value="${tm(b.s)}"></label><label>끝<input type="time" id="b_e" step="300" value="${tm(b.e)}"></label>
   <label>할 일 연결<select id="b_k"><option value="">없음</option>${dayTasks(d).map(t=>`<option value="${t.id}" ${b.taskId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>`,
   [{t:'삭제',c:'danger',f:()=>{const back=snap('days:'+d);D(d).blocks=D(d).blocks.filter(x=>x.id!==b.id);save();render();undoToast('🗑 시간 블록을 삭제했어요',back)}},{t:'취소'},
    {t:'저장',c:'primary',f:m=>{const s=toMin($('#b_s',m).value),e=toMin($('#b_e',m).value);if(isNaN(s)||isNaN(e)||e<=s)return false;b.title=$('#b_t',m).value.trim();b.s=s;b.e=e;b.taskId=$('#b_k',m).value||null;save();render()}}]);
}
function addBlock(d,s,e,taskId){const b={id:uid(),s,e,taskId:taskId||null,title:''};D(d).blocks.push(b);return b}
function evCreate(a,b){
  if(a>b)[a,b]=[b,a];
  modal('⭐ 일정 추가',`<div class="muted">${a.replace(/-/g,'.')}${b>a?' ~ '+b.replace(/-/g,'.'):''}</div><label>이름<input id="e_t" placeholder="예: 기말고사 기간"></label>${evPickers('e','','')}`,
   [{t:'취소'},{t:'추가',c:'primary',f:m=>{const t=$('#e_t',m).value.trim();if(!t)return false;const col=pickedColor('#e_col',m),cat=pickedCat('#e_cat',m);S.events.push({id:uid(),date:a,end:b>a?b:'',title:t,color:col,cat});unhideCat(cat);save();render()}}]);
  setTimeout(()=>{const i=$('#e_t');if(i)i.focus()},60);
}

const act={
  tab:a=>{view.tab=a.dataset.v;view.addSub=null;render()},
  dprev:()=>{view.date=addDays(view.date,-1);view.gs=null;render()},
  dnext:()=>{view.date=addDays(view.date,1);view.gs=null;render()},
  dtoday:()=>{view.date=today();view.gs=null;render()},
  tgl:a=>{const id=a.dataset.id;toggleDone(id);save();render();const t=T(id);if(t&&t.done&&scfg.cheer)cheer()},
  undo:a=>{const t=T(a.dataset.id);if(!t)return;setDone(t,false);if(t.parent){const p=T(t.parent);if(p&&p.done)setDone(p,false)}save();render();toast('↩ 되돌렸어요 · 할 일 목록에 다시 나타나요')},
  star:a=>{const t=T(a.dataset.id);t.star=!t.star;save();render()},
  open:a=>taskModal(a.dataset.id),
  fold:a=>{const id=a.dataset.id;view.open[id]=!isOpen(id,a.dataset.ctx);render()},
  fall:a=>{view.fAll=a.dataset.v||null;render()},
  fpick:a=>{view.fPick=a.dataset.v||null;render()},
  addto:a=>{assign(a.dataset.id,view.date);save();render()},
  addpick:()=>{const i=$('#pickNew'),v=i?.value.trim();if(!v)return;const t=newTask({name:v,scope:'day'});assign(t.id,view.date);save();render()},
  archiveDay:()=>{const L=dayTasks(view.date).filter(t=>!t.done&&!t.repeat);if(!L.length){toast('보관할 미완료 항목이 없어요');return}L.forEach(t=>setDone(t,true));save();render();toast('오늘의 미완료 항목 '+L.length+'개를 완료 기록에 보관했어요')},
  clearDayDone:()=>{const L=dayTasks(view.date).filter(t=>t.done);if(!L.length){toast('완료 표시된 항목이 없어요');return}if(!confirm('완료된 항목을 오늘의 할 일 목록에서만 숨길까요? 완료 기록과 시간표 블록은 유지돼요.'))return;L.forEach(t=>{t.days=t.days.filter(d=>d!==view.date)});save();render()},
  deltask:a=>{const t=T(a.dataset.id);if(!t||!confirm('이 할 일과 소분류를 삭제할까요?'))return;const back=snap('tasks','days');delTask(t.id);save();render();undoToast('할 일을 삭제했어요',back)},
  unas:a=>{const t=T(a.dataset.id);if(!t)return;const back=snap('tasks','days');unassign(t.id,view.date);if(t.scope==='day'&&!t.days.length)delTask(t.id);save();render();undoToast('이 날 목록에서 뺐어요',back)},
  tmr:a=>{const back=snap('tasks','days');postpone(a.dataset.id,view.date,addDays(view.date,1));save();render();undoToast('➡ 내일로 미뤘어요',back)},
  pp:a=>pickDate('어느 날로 미룰까요?',v=>{const back=snap('tasks','days');postpone(a.dataset.id,view.date,v);save();render();undoToast('➡ '+mmdd(v)+'로 미뤘어요',back)},addDays(view.date,1)),
  totoday:a=>{assign(a.dataset.id,today());save();toast('📌 오늘 할 일에 넣었어요');render()},
  asg:a=>pickDate('어느 날에 할까요?',v=>{assign(a.dataset.id,v);save();render()},today()),
  sched:a=>{
    const id=a.dataset.id,def=view.date===today()?tm(Math.min(1380,Math.ceil(nowMin()/10)*10)):'09:00';
    modal('시간 배정',`<label>시작<input id="m_s" type="time" step="600" value="${def}"></label><label>길이<select id="m_l"><option value="30">30분</option><option value="60" selected>1시간</option><option value="90">1시간 30분</option><option value="120">2시간</option><option value="180">3시간</option></select></label>`,
     [{t:'취소'},{t:'배정',c:'primary',f:m=>{const s=toMin($('#m_s',m).value);if(isNaN(s))return false;addBlock(view.date,s,Math.min(s+Number($('#m_l',m).value),1440),id);save();render()}}]);
  },
  focusDaily:()=>{$('#nt')?.focus()},
  focusAll:()=>{$('#at')?.focus()},
  focusProj:()=>{$('#pa_n')?.focus()},
  addd:()=>{const v=$('#nt').value.trim();if(!v)return;const t=newTask({name:v,scope:$('#keep').checked?'all':'day'});assign(t.id,view.date);save();render();$('#nt')&&$('#nt').focus()},
  adda:()=>{const v=$('#at').value.trim();if(!v)return;newTask({name:v,due:$('#ad').value||'',star:$('#as').checked,proj:view.fAll||''});save();render();$('#at')&&$('#at').focus()},
  addp:()=>{const v=$('#pa_n').value.trim();if(!v||!view.proj)return;newTask({name:v,due:$('#pa_d').value||'',star:$('#pa_s').checked,proj:view.proj});save();render();$('#pa_n')&&$('#pa_n').focus()},
  /* 소분류: 팝업 없이 그 자리에서 바로 입력 (Enter로 계속 추가) */
  addsub:a=>{const id=a.dataset.id;view.addSub=view.addSub===id?null:id;if(view.addSub)view.open[id]=true;render()},
  subok:()=>{
    const pid=view.addSub,p=T(pid),inp=$('#subIn');
    if(!p||!inp){view.addSub=null;render();return}
    const v=inp.value.trim();if(!v){view.addSub=null;render();return}
    newTask({name:v,due:$('#subD').value||'',parent:pid,proj:p.proj,scope:p.scope});if(p.done)setDone(p,false);
    view.open[pid]=true;save();render();
  },
  subx:()=>{view.addSub=null;render()},
  addrep:()=>{
    modal('🔁 반복 할 일',`<label>이름<input id="r_n" placeholder="예: 영양제, 운동"></label><div class="row">${[1,2,3,4,5,6,0].map(x=>`<label class="small"><input type="checkbox" class="rpn" value="${x}" style="width:auto"> ${WD[x]}</label>`).join('')}<button class="btn" id="rAll">매일</button></div><label class="chk"><input type="checkbox" id="r_s"> ★ 중요</label><div class="small muted">정해진 요일의 일간 화면에 자동으로 들어와요. 그날 완료하면 완료 기록에 남아요.</div>`,
     [{t:'취소'},{t:'추가',c:'primary',f:m=>{const n=$('#r_n',m).value.trim(),days=[...document.querySelectorAll('.rpn:checked')].map(Number);if(!n||!days.length){alert('이름과 요일을 확인해 주세요.');return false}newTask({name:n,star:$('#r_s',m).checked,repeat:days});save();render()}}]);
    $('#rAll').onclick=()=>document.querySelectorAll('.rpn').forEach(c=>c.checked=true);

    [{t:'취소'},{t:'추가',c:'primary',f:m=>{const n=$('#q_n',m).value.trim();if(!n)return false;const t=newTask({name:n,due:$('#q_d',m).value,star:$('#q_s',m).checked});if($('#q_t',m).checked)assign(t.id,view.date);save();render()}}]),
  fxrestore:()=>{const o=S.fx[view.date]||{};Object.keys(o).forEach(k=>{if(o[k].hidden)delete o[k]});save();render()},
  closeday:()=>{
    const r=rate(view.date);if(r==null){alert('이 날 할 일이 없어요.');return}
    D(view.date).closed={rate:r,at:Date.now()};
    const q=pickQuote(r>=80?['win','adv']:r>=40?['res','fri','adv']:['cmf','res']);save();
    modal('오늘의 달성률',`<div class="big">${r}%</div>${quoteHTML(q)}`,[{t:'확인',c:'primary'}]);render();
  },
  cheer:()=>{view.quote=pickQuote(cheerCats());render()},
  /* D-day */
  ddm:()=>ddayModal(),
  ddadd:()=>{const n=$('#dd_n').value.trim(),d=$('#dd_d').value;if(!n||!d){alert('이름과 날짜를 넣어 주세요.');return}S.ddays.push({id:uid(),name:n,date:d,show:true,done:false,doneAt:null});save();render();ddayModal()},

     [{t:'취소',f:()=>{setTimeout(ddayModal,0)}},{t:'저장',c:'primary',f:m=>{const n=$('#de_n',m).value.trim(),d=$('#de_d',m).value;if(!n||!d)return false;x.name=n;x.date=d;save();render();setTimeout(ddayModal,0)}}]);
  },

function egCalc(){
  const g=eg,hv=g.hv;
  if(g.mode==='create'){g.ra=g.d0<hv?g.d0:hv;g.rb=g.d0<hv?hv:g.d0;return}
  const s0=g.s0,e0=g.e0;
  if(g.mode==='move'){const df=dayDiff(g.d0,hv);g.ra=addDays(s0,df);g.rb=addDays(e0,df)}
  else if(g.mode==='rl'){g.ra=hv<e0?hv:e0;g.rb=e0}
  else{g.ra=s0;g.rb=hv>s0?hv:s0}
}

const REST_EMO='🛋️';
const SC='harbor_snd_cfg',SDB='harbor_snd',RS='harbor_rest';

let snd=[],sndLast=-1,unlocked=false;
const au=new Audio();au.preload='auto';
const SNDCH={'루피':'luffy','조로':'zoro','나미':'nami','쵸파':'chopper','상디':'sanji','비비':'vivi','로빈':'robin','프랑키':'franky','브룩':'brook'};
const chOf=n=>{const s=String(n).normalize('NFC');for(const k in SNDCH)if(s.includes(k))return SNDCH[k];return null};
function sdb(){return new Promise((res,rej)=>{const r=indexedDB.open(SDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function sdo(mode,fn){const db=await sdb();return new Promise((res,rej)=>{const tx=db.transaction('f',mode),rq=fn(tx.objectStore('f'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}
async function loadSnd(){try{const arr=await sdo('readonly',s=>s.getAll());snd.forEach(x=>URL.revokeObjectURL(x.url));snd=(arr||[]).map(r=>({id:r.id,name:r.name,url:URL.createObjectURL(r.blob)}))}catch(e){snd=[]}}
async function addSnd(files){for(const f of files){const name=f.name.replace(/\.[^.]+$/,'').normalize('NFC');await sdo('readwrite',s=>s.put({id:uid(),name,blob:f}))}await loadSnd()}
const sndCls=()=>'sndbtn'+(scfg.mute?' off':'')+((!scfg.mute&&snd.length&&!unlocked)?' need':'');
const sndBtn=x=>`<button class="${sndCls()} ${x}" data-act="sndtoggle" aria-label="소리 켜기/끄기" title="${scfg.mute?'소리 켜기':'소리 끄기'}">${scfg.mute?'🔇':'🔊'}</button>`;

function unlock(){
  if(unlocked||!snd.length)return;
  try{au.muted=true;au.src=snd[0].url;const p=au.play();
    if(p&&p.then)p.then(()=>{au.pause();au.currentTime=0;au.muted=false;unlocked=true;fabState()}).catch(()=>{au.muted=false});

  let i;do{i=rnd(snd.length)}while(snd.length>1&&i===sndLast);sndLast=i;

/* 휴식: 지금 이후의 일반 일정을 휴식 시간만큼 뒤로 밀어요 (고정 일정은 그대로) */
const rest=()=>{try{const r=JSON.parse(localStorage.getItem(RS));return r&&r.until?r:null}catch(e){return null}};
function startRest(mins){
  mins=Math.max(5,Math.min(180,Math.round((+mins||10)/5)*5));scfg.restMin=mins;saveSc();
  const d=today(),nm=nowMin(),moved=[];let over=0;
  D(d).blocks.slice().sort((a,b)=>a.s-b.s).forEach(b=>{
    if(b.e<=nm)return;const run=b.s<nm,ns=run?b.s:b.s+mins,ne=b.e+mins;
    if(ne>1440)over++;
    b.s=Math.min(ns,1430);b.e=Math.min(1440,Math.max(ne,b.s+10));moved.push({id:b.id,run});
  });
  localStorage.setItem(RS,JSON.stringify({until:Date.now()+mins*60000,mins,moved,date:d}));
  if(moved.length)save();
  toast(REST_EMO+' '+mins+'분 휴식 시작 · 일정 '+moved.length+'개를 뒤로 밀었어요'+(over?' (자정을 넘긴 일정 '+over+'개)':''));
  render();tick();
  setTimeout(()=>doPull(),1200);
}
function endRest(auto){
  const r=rest();if(!r)return;
  const remain=auto?0:Math.floor((r.until-Date.now())/60000);let back=0;
  if(remain>0&&r.date===today()){
    const bl=D(r.date).blocks;
    r.moved.forEach(m=>{const b=bl.find(x=>x.id===m.id);if(!b)return;
      if(m.run){b.e=Math.max(b.s+10,b.e-remain)}else{const len=b.e-b.s,ns=Math.max(0,b.s-remain);b.s=ns;b.e=ns+len}
      back++});
    if(back)save();
  }
  localStorage.removeItem(RS);
  if(auto){if(scfg.rest)announce(REST_EMO+' 휴식 끝! 다시 시작해요 💪');else toast(REST_EMO+' 휴식이 끝났어요. 다시 시작해요')}
  else toast('휴식을 마쳤어요'+(back?' · 남은 '+remain+'분만큼 일정을 앞으로 당겼어요':''));
  render();
}
function openRest(){
  const r=rest();
  if(r){modal(REST_EMO+' 휴식 중',`<div class="big" id="restBig"></div><div class="small muted">끝내기를 누르면 남은 시간만큼 일정을 다시 앞으로 당겨요.</div>`,[{t:'닫기'},{t:'휴식 끝내기',c:'primary',f:()=>{endRest(false)}}]);tick();return}
  modal(REST_EMO+' 휴식',`<p class="small muted">지금 시각 이후의 일반 일정이 휴식 시간만큼 뒤로 밀려요. 고정 일정(수업 등)은 움직이지 않아요. 진행 중인 일정은 끝나는 시간이 늘어나요.</p><div class="row"><button class="btn" id="rM">−5</button><input type="number" id="rMin" min="5" max="180" step="5" value="${scfg.restMin}"><button class="btn" id="rP">+5</button><span class="muted">분</span></div>`,[{t:'취소'},{t:'휴식 시작',c:'primary',f:m=>{startRest(+$('#rMin',m).value)}}]);
  $('#rM').onclick=()=>{$('#rMin').value=Math.max(5,(+$('#rMin').value||10)-5)};

/* 1초마다: 휴식 타이머 · 일반 일정 시작/끝 알림 (고정 일정은 확인조차 하지 않음) */
const fired=new Set(),startedAt=Date.now();
function tick(){
  try{
    const now=Date.now(),d=today();
    const r=rest();if(r&&now>=r.until)endRest(true);
    const r2=rest();if(r2){const tx=restFmt(r2),rt=$('#restT');if(rt)rt.textContent=tx;const big=$('#restBig');if(big)big.textContent=tx}
    const dd=S.days[d];
    if(dd&&dd.blocks&&dd.blocks.length){
      const st=[],en=[];
      dd.blocks.forEach(b=>{
        [['s',b.s],['e',b.e]].forEach(([k,t])=>{
          const key=d+'|'+b.id+'|'+k+'|'+t,at=parse(d).getTime()+t*60000;
          if(fired.has(key))return;
          if(now>=at&&now<at+120000&&at+60000>startedAt){
            fired.add(key);if(r2)return;
            if(k==='s'&&scfg.start)st.push(b);
            if(k==='e'&&scfg.end)en.push(b);
          }
        });
      });
      if(st.length||en.length){
        const parts=[];
        en.forEach(b=>parts.push('■ 끝: '+esc(bTitle(b))));
        st.forEach(b=>parts.push('▶ 시작: '+esc(bTitle(b))));
        announce(parts.join(' · '),en.length>0);
      }
    }
    const nl=$('.nowl');if(nl&&view.tab==='daily'&&view.date===d)nl.style.top=((nowMin()-S.settings.startHour*60)/10*12)+'px';
  }catch(e){}
}

  const ix=new Map(o.map((id,i)=>[id,i]));

let rd=null,rdBlock=0,lastPT='mouse';
const rdLine=(()=>{const d=document.createElement('div');d.id='rdLine';document.body.appendChild(d);return d})();
const rdItems=()=>[...document.querySelectorAll('[data-ok]')].filter(x=>x.dataset.ok===rd.key);
function rdCalc(){
  const others=rdItems().filter(x=>x!==rd.el),hz=rd.ax==='x';
  let idx=0;
  others.forEach(o=>{
    const r=o.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
    const before=hz?(rd.y>r.bottom||(rd.y>=r.top&&rd.x>mx)):(rd.y>my);
    if(before)idx++;
  });
  rd.idx=idx;rd.others=others;
  const ref=others[idx]||others[others.length-1];
  if(!ref){rdLine.style.display='none';return}
  const r=ref.getBoundingClientRect(),after=!others[idx];let L,T0,W,H;
  if(hz){L=(after?r.right:r.left)-2;T0=r.top;W=3;H=r.height}else{L=r.left;T0=(after?r.bottom:r.top)-1;W=r.width;H=3}
  Object.assign(rdLine.style,{display:'block',left:L+'px',top:T0+'px',width:W+'px',height:H+'px'});
}
function rdMove(){
  if(!rd||!rd.active)return;
  const dx=rd.x-rd.x0+(window.scrollX-rd.sx),dy=rd.y-rd.y0+(window.scrollY-rd.sy);
  rd.el.style.transform=rd.ax==='x'?'translate('+dx+'px,'+dy+'px)':'translateY('+dy+'px)';
  rdCalc();
}
function rdActivate(){
  if(!rd||rd.active)return;
  rd.active=true;rd.el.classList.add('lifted');document.body.classList.add('rding');
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(_){}
  try{rd.el.setPointerCapture(rd.pid)}catch(_){}
  rd.iv=setInterval(()=>{if(rd&&rd.sp){window.scrollBy(0,rd.sp);rdMove()}},16);
  rdMove();
}
function rdStart(e,item,imm){
  rd={key:item.dataset.ok,id:item.dataset.oid,el:item,ax:item.dataset.ax||'y',re:item.dataset.re||'',pid:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,sx:window.scrollX,sy:window.scrollY,active:false,imm:imm,sp:0};
  if(imm){const dr=e.target.closest('[draggable="true"]');if(dr){dr.setAttribute('draggable','false');rd.dr=dr}}
  else rd.timer=setTimeout(rdActivate,400);
}
function applyOrder(key,ids,re){
  const old=ORD()[key]||[];ORD()[key]=[...ids,...old.filter(i=>!ids.includes(i))];
  save();render();if(re==='dd')ddayModal();
}
function rdFinish(ok){
  const r=rd;if(!r)return;
  clearTimeout(r.timer);clearInterval(r.iv);
  if(r.dr)r.dr.setAttribute('draggable','true');
  if(r.active){
    const alive=document.contains(r.el);
    if(ok&&alive)rdCalc();
    rdBlock=Date.now()+400;rdLine.style.display='none';r.el.classList.remove('lifted');r.el.style.transform='';document.body.classList.remove('rding');
    try{r.el.releasePointerCapture(r.pid)}catch(_){}
    if(ok&&alive&&r.others){
      const ids=r.others.map(o=>o.dataset.oid);ids.splice(r.idx,0,r.id);
      const cur=rdItems().map(o=>o.dataset.oid);
      rd=null;
      if(ids.join('|')!==cur.join('|'))applyOrder(r.key,ids,r.re);
      return;
    }
  }
  rd=null;
}
document.addEventListener('pointerdown',e=>{
  lastPT=e.pointerType;
  if(rd)return;
  const t=e.target;if(!t||!t.closest)return;
  const h=t.closest('.hnd');
  if(h){if(e.pointerType==='mouse'&&e.button>0)return;const it=h.closest('[data-oid]');if(it)rdStart(e,it,true);return}
  const item=t.closest('[data-oid]');
  if(e.pointerType==='mouse'){
    if(item&&item.classList.contains('chip')&&item.dataset.ok==='projtabs'){rdStart(e,item,true);return}
    return;
  }
  if(!item||t.closest('.subadd,.resortrow'))return;
  const inter=t.closest('button,input,select,textarea,a');if(inter&&inter!==item)return;
  rdStart(e,item,false);
},true);
document.addEventListener('pointermove',e=>{
  if(!rd||e.pointerId!==rd.pid)return;
  rd.x=e.clientX;rd.y=e.clientY;
  const mv=Math.hypot(rd.x-rd.x0,rd.y-rd.y0);
  if(!rd.active){
    if(rd.imm){if(mv>4)rdActivate()}
    else if(mv>10){clearTimeout(rd.timer);rd=null}
    return;
  }
  const vh=window.innerHeight;
  rd.sp=rd.y<64?-Math.min(18,Math.ceil((64-rd.y)/4)):rd.y>vh-64?Math.min(18,Math.ceil((rd.y-(vh-64))/4)):0;
  rdMove();
});
document.addEventListener('pointerup',e=>{if(rd&&e.pointerId===rd.pid)rdFinish(true)});
document.addEventListener('pointercancel',e=>{if(rd&&e.pointerId===rd.pid)rdFinish(false)});
window.addEventListener('blur',()=>rdFinish(false));
document.addEventListener('touchmove',e=>{if(rd&&rd.active&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('selectstart',e=>{if(rd&&rd.active)e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(lastPT!=='mouse'&&e.target.closest&&e.target.closest('[data-oid],.hnd,.task,.chip,.hbrow'))e.preventDefault()});

/* ============ 시작 ============ */
purge();
applyBg();
render();
doPull();
fabState();
loadSnd().then(()=>{
  fabState();
  if(!snd.length)toast('🔔 알림음 파일이 아직 없어요','추가하러 가기',openSound,9000);
  else if(!scfg.mute)toast('🔔 화면을 한 번 터치하면 알림음이 활성화돼요',null,null,5000);
  if(view.tab==='settings')render();
});
wake();
setInterval(tick,1000);tick();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
