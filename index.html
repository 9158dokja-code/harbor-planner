*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
.bgphoto{position:fixed;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;opacity:.3;display:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input[type=text],input:not([type]),input[type=date],input[type=time],input[type=number],input[type=password],input[type=file],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%;outline:0}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin:8px 0}label.chk input{width:auto}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:210px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:fixed;left:0;top:0;bottom:0;z-index:2}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin:4px 10px 24px;color:var(--accent)}.logo svg{flex:none}.logo span{color:var(--text)}.logo small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}.nav button{padding:11px 13px;text-align:left;border-radius:11px;display:flex;align-items:center;gap:8px}.nav button.active{background:var(--soft);font-weight:700}
.main{margin-left:210px;width:calc(100% - 210px);padding:26px;max-width:1400px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}.title{font-size:25px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
.btn{background:var(--soft);border-radius:10px;padding:8px 13px;font-size:13px}.btn.primary{background:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
.row>input{flex:1;min-width:110px}
.note{border:0!important;background:transparent!important;font-size:17px;font-weight:600;padding:5px!important}
.notecard{display:flex;align-items:center;gap:12px;padding:12px 16px}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.dd{display:inline-flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 10px 5px;border-radius:12px;background:var(--soft);border:1px solid var(--line);line-height:1.15}
.dd b{font-size:15px;color:var(--accent)}.dd small{font-size:10px;color:var(--muted);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd.hot{background:var(--accent);border-color:var(--accent)}.dd.hot b,.dd.hot small{color:#fff}.dd.past b{color:var(--danger)}
.dd.add{flex-direction:row;border-style:dashed;background:none;color:var(--muted);font-size:12px;min-width:0;padding:7px 10px}

.check{width:21px;height:21px;border:1.5px solid #aaa;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;color:#fff}.check.done{background:var(--accent);border-color:var(--accent)}

.ic:hover{opacity:1}
.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent)}

.gridwrap{height:82vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:#fff}

.hl{position:absolute;left:0;right:0;border-top:1px solid #d6d8dc;pointer-events:none}.hl span{position:absolute;top:2px;left:4px;font-size:10px;color:var(--muted)}

.blk.fx{background:var(--fx);border-left-color:var(--fxl)}.blk.fx.lk{cursor:pointer}.blk.dn{opacity:.55;text-decoration:line-through}
.mg{display:grid;grid-template-columns:minmax(84px,.85fr) repeat(7,1fr);gap:4px}.wd{text-align:center;font-size:11px;color:var(--muted)}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px 6px;font-size:12px;cursor:pointer;position:relative;user-select:none}
.day.today{outline:2px solid var(--accent)}.day .pt{position:absolute;right:6px;top:5px;font-size:10px;color:#555}
.ev{height:16px;line-height:16px;font-size:11px;margin-top:2px;border-radius:5px;padding:0 4px;white-space:nowrap;overflow:hidden;position:relative;z-index:1;color:#333;cursor:grab}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}
.modalbox{background:#fff;border-radius:18px;padding:18px;width:min(480px,100%);max-height:90vh;overflow:auto}
.modalbox h3{margin:0 0 8px}.modalbox label{display:block;margin:8px 0;font-size:12px;color:var(--muted)}
.mobile-nav{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:none;align-items:center;gap:10px;max-width:92vw;background:#222;color:#fff;padding:11px 14px;border-radius:14px;z-index:40;font-size:14px}
.hbrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.hbrow span{flex:1}
@media(max-width:860px){.sidebar{display:none}.main{margin:0;width:100%;padding:16px 12px 84px}.cols{grid-template-columns:1fr}.title{font-size:21px}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.mobile-nav button{font-size:10px;color:#777;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}.mobile-nav button.active{color:var(--accent);font-weight:800}.gridwrap{height:65vh}}
.hnd{display:none;flex:none;cursor:grab;color:var(--muted);font-size:16px;padding:5px 4px}
@media (any-pointer:fine){.hnd{display:inline-block}}
.cpk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.sw{width:22px;height:22px;border-radius:50%;padding:0;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);margin:2px}
.sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.cc{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;background:var(--soft);font-size:13px;border:1.5px solid transparent}
.cc.on{border-color:var(--accent);background:#fff;font-weight:700}
.evchip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 12px 5px 10px;border-radius:9px;border:1px solid var(--ev-border,#d8e0e4);background:var(--ev-bg,#eef3f5);color:var(--ev-text,#4f5b60);font-size:13px;font-weight:700}
.wm textarea{flex:1;min-width:0;min-height:100px;resize:none;border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.65);padding:8px;font-size:12px;line-height:1.45}

<script>
const $=(s,e=document)=>e.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmtD(d)};
const today=()=>fmtD(new Date());
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const mmdd=s=>s.slice(5).replace('-','.');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const WD=['일','월','화','수','목','금','토'];

const KEY='harbor_planner_v2';
const defaults=()=>({tasks:[],days:{},fixed:[],fx:{},events:[],cats:[],weeks:{},projects:[],ddays:[],repGen:{},order:{},settings:{theme:'clean',startHour:9,endHour:27},archive:[],updatedAt:0});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=defaults();Object.assign(d,r);d.settings=Object.assign(defaults().settings,r.settings||{});return d}}catch(e){}return defaults()}
let S=load();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ 저장 공간 부족',null,null,4000)}render()}
const D=d=>{const x=S.days[d]||(S.days[d]={note:'',blocks:[],closed:null});x.blocks=x.blocks||[];return x};
const T=id=>S.tasks.find(t=>t.id===id);
const P=id=>S.projects.find(p=>p.id===id);
const kids=id=>S.tasks.filter(x=>x.parent===id);
function newTask(o){const t=Object.assign({id:uid(),name:'',due:'',star:false,memo:'',done:false,doneAt:null,createdAt:Date.now(),createdDay:today(),days:[],moves:[],scope:'day',proj:'',parent:'',repeat:null,rid:''},o);S.tasks.push(t);return t}
const dayTasks=d=>S.tasks.filter(t=>t.days.includes(d));
function assign(id,d){const t=T(id);if(t&&!t.days.includes(d))t.days.push(d)}
function unassign(id,d){const t=T(id);if(!t)return;t.days=t.days.filter(x=>x!==d);D(d).blocks=D(d).blocks.filter(b=>b.taskId!==id)}
function setDone(t,v){t.done=v;t.doneAt=v?Date.now():null}
function toggleDone(id){
  const t=T(id);if(!t||t.repeat)return;const v=!t.done;setDone(t,v);
  kids(id).forEach(k=>{if(k.done!==v)setDone(k,v)});
  if(t.parent){const p=T(t.parent);if(p){const ad=kids(p.id).every(k=>k.done);if(p.done!==ad)setDone(p,ad)}}
  save();
}
function delTask(id){const ids=new Set([id,...kids(id).map(k=>k.id)]);S.tasks=S.tasks.filter(x=>!ids.has(x.id));Object.values(S.days).forEach(dd=>dd.blocks=(dd.blocks||[]).filter(b=>!ids.has(b.taskId)));save()}

/* 3일 뒤 보관함 삭제 및 완료 처리 */
function purge(){
  const cut=Date.now()-3*864e5;let ch=false;
  S.archive=(S.archive||[]).filter(x=>x.archivedAt>cut);
  if(S.archive.length!== (S.archive||[]).length) ch=true;
  if(ch)save();
}

function ensureRepeats(d){
  let ch=false;const wd=parse(d).getDay();
  S.tasks.filter(t=>t.repeat&&t.repeat.length).forEach(tpl=>{
    if(d<tpl.createdDay||!tpl.repeat.includes(wd))return;
    const k=tpl.id+'|'+d;if(S.repGen[k])return;
    S.repGen[k]=1;const t=newTask({name:tpl.name,star:tpl.star,memo:tpl.memo,rid:tpl.id,scope:'day'});t.days.push(d);ch=true;
  });
  if(ch)save();
}

/* 26시 등 타임라인 시간 변환 및 고정 일정 */
function parseTimeStr(str){
  if(!str)return 540; // 기본 오전 9시 (540분)
  let [h,m]=str.split(':').map(Number);
  if(isNaN(h))return 540;
  return h*60+(m||0);
}
function formatTimeMin(m){
  let h=Math.floor(m/60), min=m%60;
  return `${pad(h)}:${pad(min)}`;
}

function fixedFor(d){
  const wd=parse(d).getDay();
  return S.fixed.filter(f=>f.from<=d&&d<=f.to&&f.days.includes(wd)).map(f=>{
    const x=(S.fx[d]||{})[f.id]||{};if(x.hidden)return null;
    return{id:'fx_'+f.id,fid:f.id,title:x.title??f.title,s:x.s??f.s,e:x.e??f.e,fixed:true,unlocked:!!x.unlocked};
  }).filter(Boolean);
}

/* 공휴일 계산기 (한국 주요 공휴일 및 대체공휴일 등) */
function getKoreanHolidays(year){
  let h={
    [`${year}-01-01`]:'신정',
    [`${year}-03-01`]:'삼일절',
    [`${year}-05-05`]:'어린이날',
    [`${year}-06-06`]:'현충일',
    [`${year}-08-15`]:'광복절',
    [`${year}-10-03`]:'개천절',
    [`${year}-10-09`]:'한글날',
    [`${year}-12-25`]:'성탄절'
  };
  // 음력 명절 (2026년 기준 등 간이 매핑 또는 기본 고정 공휴일)
  if(year===2026){
    Object.assign(h,{'2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴','2026-05-24':'부처님오신날','2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴'});
  } else if(year===2025){
    Object.assign(h,{'2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴','2025-05-05':'부처님오신날','2025-10-05':'추석연휴','2025-10-06':'추석','2025-10-07':'추석연휴'});
  } else {
    // 일반적인 기본 명절 placeholder
    Object.assign(h,{[`${year}-02-10`]:'설날',[`${year}-09-17`]:'추석'});
  }
  return h;
}

/* 탭 구조 */
const TABS=[
  {id:'day',name:'일간',icon:'📅'},
  {id:'week',name:'주간',icon:'📊'},
  {id:'month',name:'월간',icon:'🗓️'},
  {id:'timeline',name:'시간표',icon:'⏰'},
  {id:'projects',name:'항로',icon:'🧭'},
  {id:'settings',name:'설정',icon:'⚙️'}
];
let curTab='day', curDay=today();

function toast(m,bLbl,bFn,dur=3000){
  const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`+(bLbl?`<button id="tbtn">${bLbl}</button>`:'');
  t.style.display='flex';if(bLbl&&bFn){$('#tbtn').onclick=()=>{bFn();t.style.display='none'}}
  setTimeout(()=>t.style.display='none',dur);
}

function modal(title,html,btns=[]){
  $('#modalbox').innerHTML=`<h3>${title}</h3>${html}<div class="mbt">${btns.map(b=>`<button class="btn ${b.c||''}" data-mclose="${b.t}">${b.t}</button>`).join('')}</div>`;
  $('#modal').classList.add('show');
  $('#modalbox').querySelectorAll('[data-mclose]').forEach(el=>el.onclick=()=>$('#modal').classList.remove('show'));
}

/* 렌더러 메인 */
function render(){
  purge();
  ensureRepeats(curDay);
  const n=$('#nav'), mn=$('#mnav');
  n.innerHTML=TABS.map(tb=>`<button class="${curTab===tb.id?'active':''}" onclick="curTab='${tb.id}';render()">${tb.icon} <span>${tb.name}</span></button>`).join('');
  mn.innerHTML=TABS.map(tb=>`<button class="${curTab===tb.id?'active':''}" onclick="curTab='${tb.id}';render()">${tb.icon}<span>${tb.name}</span></button>`).join('');

  const m=$('#main');
  if(curTab==='day') renderDay(m);
  else if(curTab==='week') renderWeek(m);
  else if(curTab==='month') renderMonth(m);
  else if(curTab==='timeline') renderTimeline(m);
  else if(curTab==='projects') renderProjects(m);
  else if(curTab==='settings') renderSettings(m);
}

/* 1,3,4,8,9,14,15,16번 요구사항 반영된 일간(day) 탭 */
function renderDay(el){
  const dObj=D(curDay);
  const tasks=dayTasks(curDay);
  el.innerHTML=`
    <div class="top">
     <div><div class="title">일간 항해</div><div class="sub">${curDay} (${WD[parse(curDay).getDay()]}요일)</div></div>
     <div class="row">
      <input type="date" value="${curDay}" onchange="curDay=this.value;render()" style="width:auto">
      <button class="btn" onclick="curDay=today();render()">오늘</button>
     </div>
    </div>
    
    <div class="card hero">
     <div class="notecard">
      <div class="note" contenteditable="true" onblur="D(curDay).note=this.innerText;save()">${esc(dObj.note||'오늘의 한마디를 적어보세요')}</div>
     </div>
    </div>

    <div class="cols">
     <div>
      <div class="card" style="min-height:350px;">
       <div class="row between"><b>📋 오늘의 할일</b> <button class="btn primary" onclick="completeAllDone()">완료된 항목 일괄 이동/보관</button></div>
       <div class="small muted" style="margin-bottom:8px">빈 곳을 누르면 바로 입력이 시작됩니다. (기본 일간 전용)</div>
       
       <div id="taskList" onclick="focusNewTaskInput(event)" style="min-height:180px; cursor:text;">
        ${tasks.map(t=>{
          const pr=t.proj?P(t.proj):null;
          const isHighlighted=pr&&pr.highlightToday; // 항로에서 빨갛게 하이라이트된 항목
          return `<div class="task ${isHighlighted?'hl-today':''}">
           <div class="check ${t.done?'done':''}" onclick="toggleDone('${t.id}')">${t.done?'✓':''}</div>
           <div class="taskname ${t.done?'done':''}" onclick="openTaskModal('${t.id}')">${esc(t.name)} ${t.due?`<span class="pill">~${t.due}</span>`:''}</div>
           <button class="ic" onclick="delTask('${t.id}');event.stopPropagation();" title="삭제">✕</button>
          </div>`;
        }).join('') || '<div class="empty">등록된 할일이 없어요. 아래 또는 빈 공간을 눌러 추가하세요.</div>'}
       </div>

       <!-- 일간 개별 입력: 전체 체크 해제 및 일간에만 입력이 기본 -->
       <div class="row" style="margin-top:12px;">
        <input type="text" id="new_tname" placeholder="새 할일 입력..." onkeydown="if(event.key==='Enter')addDailyTask()">
        <button class="btn primary" onclick="addDailyTask()">추가</button>
       </div>
      </div>

      <!-- 가져오기 영역 (입력 가능) -->
      <div class="card">
       <b>📥 다른 항로/전체에서 가져오기</b>
       <div class="small muted" style="margin:4px 0 8px">미완료된 중요 항로 할일을 오늘로 가져옵니다.</div>
       <input type="text" id="import_filter" placeholder="검색어로 가져오기 필터링..." oninput="renderImportList(this.value)">
       <div id="importList" style="margin-top:8px; max-height:150px; overflow-y:auto;"></div>
      </div>
     </div>

     <div>
      <div class="card">
       <div class="row between"><b>⏰ 오늘 시간 계획</b> <button class="btn" onclick="openTimeModal()">+ 일정 추가</button></div>
       <div class="gridwrap" style="margin-top:10px;">
        <!-- 타임라인 09시 ~ 익일 27시(새벽 3시) -->
        <div class="grid" style="height:1080px;" id="timeGrid">
         ${renderTimelineBlocks(curDay)}
        </div>
       </div>
      </div>
     </div>
    </div>
  `;
  renderImportList('');
}

function focusNewTaskInput(e){
  if(e.target.classList.contains('card') || e.target.id==='taskList'){
    $('#new_tname').focus();
  }
}

function addDailyTask(){
  const name=$('#new_tname').value.trim();
  if(!name)return;
  const t=newTask({name, scope:'day'});
  t.days.push(curDay);
  $('#new_tname').value='';
  save();
}

function renderImportList(filter){
  const el=$('#importList');if(!el)return;
  const list=S.tasks.filter(t=>!t.done&&!t.days.includes(curDay)&&(!filter||t.name.includes(filter)));
  el.innerHTML=list.slice(0,10).map(t=>`
    <div class="hbrow">
     <span>${esc(t.name)}</span>
     <button class="btn" onclick="assign('${t.id}','${curDay}');save()">오늘에 추가</button>
    </div>
  `).join('')||'<div class="small muted">가져올 항목이 없습니다.</div>';
}

function completeAllDone(){
  // 완료된 항목을 archive로 보내고 3일 보관함 관리
  const doneTasks=S.tasks.filter(t=>t.done);
  doneTasks.forEach(t=>{
    S.archive.push({...t, archivedAt:Date.now()});
    delTask(t.id);
  });
  save();
  toast('완료된 항목이 보관함으로 이동되었습니다. (3일간 유지)');
}

/* 7번 요구사항: 탭 아이콘 통일 */
/* TABS 배열에 아이콘이 모두 포함되어 있으므로 네비게이션이 통일됨 */

/* 5, 6번 요구사항: 월간 캘린더 (공휴일 표시 및 다일정 즉시 입력) */
function renderMonth(el){
  const d=parse(curDay), y=d.getFullYear(), m=d.getMonth();
  const firstDay=new Date(y, m, 1), lastDate=new Date(y, m+1, 0);
  const startDayOfWeek=firstDay.getDay();
  const holidays=getKoreanHolidays(y);

  let html=`
    <div class="top">
     <div class="title">${y}년 ${m+1}월</div>
     <div class="row">
      <button class="btn" onclick="shiftMonth(-1)">◀ 이전달</button>
      <button class="btn" onclick="curDay=today();render()">이번달</button>
      <button class="btn" onclick="shiftMonth(1)">다음달 ▶</button>
     </div>
    </div>
    <div class="card">
     <div class="mg">
      ${WD.map(w=>`<div class="wd">${w}</div>`).join('')}
  `;
  for(let i=0;i<startDayOfWeek;i++) html+=`<div class="day" style="opacity:0.2"></div>`;
  for(let day=1; day<=lastDate.getDate(); day++){
    const ds=`${y}-${pad(m+1)}-${pad(day)}`;
    const isHol=holidays[ds];
    html+=`<div class="day ${ds===today()?'today':''}" onclick="openMonthDayModal('${ds}')">
     <div class="pt" style="color:${isHol?'#e05252':'inherit'}">${day} ${isHol?`<br><small style="color:#e05252">${isHol}</small>`:''}</div>
    </div>`;
  }
  html+=`</div></div>`;
  el.innerHTML=html;
}

function shiftMonth(n){
  const d=parse(curDay); d.setMonth(d.getMonth()+n); curDay=fmtD(d); render();
}

function openMonthDayModal(ds){
  modal(`🗓️ ${ds} 일정 관리`, `
    <label>일정 제목 <input type="text" id="md_title" placeholder="일정 이름 입력..."></label>
    <div class="row">
     <label>시작일 <input type="date" id="md_start" value="${ds}"></label>
     <label>종료일 <input type="date" id="md_end" value="${ds}"></label>
    </div>
    <button class="btn primary" style="margin-top:10px" onclick="addMultiDayEvent()">바로 등록</button>
  `,[{t:'닫기',c:'primary'}]);
}

function addMultiDayEvent(){
  const title=$('#md_title').value.trim();
  const start=$('#md_start').value;
  const end=$('#md_end').value || start;
  if(!title)return;
  S.events.push({id:uid(), title, start, end, color:'#35728a'});
  save();
  $('#modal').classList.remove('show');
  render();
}

/* 10, 11번 요구사항: 시간표 사진 업로드 및 고정시간표 기간 유지 */
function renderTimeline(el){
  el.innerHTML=`
    <div class="top">
     <div class="title">고정 시간표 관리</div>
     <div class="row">
      <button class="btn primary" onclick="openFixedModal()">+ 고정 시간표 추가</button>
      <label class="btn" style="cursor:pointer; display:inline-flex; align-items:center; gap:4px;">
       📷 시간표 사진 업로드 <input type="file" accept="image/*" style="display:none" onchange="uploadTimetableImage(this)">
      </label>
     </div>
    </div>
    <div class="card">
     <b>등록된 고정 일정(${S.fixed.length}개)</b>
     <div style="margin-top:10px;">
      ${S.fixed.map(f=>`
        <div class="hbrow">
         <span><b>${esc(f.title)}</b> (${f.from} ~ ${f.to}) - ${f.s} ~ ${f.e}</span>
         <button class="btn danger" onclick="delFixed('${f.id}')">삭제</button>
        </div>
      `).join('')||'<div class="empty">등록된 고정 시간표가 없습니다. 직전에 입력한 기간이 자동으로 유지됩니다.</div>'}
     </div>
    </div>
  `;
}

let lastFixedPeriod={from:today(), to:addDays(today(),30)};

function openFixedModal(){
  modal('⏰ 고정 시간표 등록', `
    <label>제목 <input type="text" id="fx_title" placeholder="예: 수업, 알바"></label>
    <div class="row">
     <label>시작 시간 <input type="time" id="fx_s" value="09:00"></label>
     <label>종료 시간 <input type="time" id="fx_e" value="10:30"></label>
    </div>
    <div class="row">
     <label>적용 시작일 <input type="date" id="fx_from" value="${lastFixedPeriod.from}"></label>
     <label>적용 종료일 <input type="date" id="fx_to" value="${lastFixedPeriod.to}"></label>
    </div>
    <label>요일 선택</label>
    <div class="row">
     ${WD.map((w,i)=>`<label class="chk"><input type="checkbox" name="fx_w" value="${i}" ${i>=1&&i<=5?'checked':''}> ${w}</label>`).join('')}
    </div>
    <button class="btn primary" style="margin-top:10px" onclick="saveFixedSchedule()">저장</button>
  `,[{t:'닫기',c:'primary'}]);
}

function saveFixedSchedule(){
  const title=$('#fx_title').value.trim();
  const s=$('#fx_s').value, e=$('#fx_e').value;
  const from=$('#fx_from').value, to=$('#fx_to').value;
  const days=[...document.querySelectorAll('input[name="fx_w"]:checked')].map(el=>Number(el.value));
  if(!title||!from||!to)return;
  lastFixedPeriod={from, to};
  S.fixed.push({id:uid(), title, s, e, from, to, days});
  save();
  $('#modal').classList.remove('show');
  render();
}

function uploadTimetableImage(input){
  if(input.files&&input.files[0]){
    toast('시간표 사진이 등록되었습니다! AI 인식 모듈 연동 준비 완료.');
  }
}

function delFixed(id){
  S.fixed=S.fixed.filter(f=>f.id!==id);
  save();
  render();
}

/* 타임라인 블록 렌더링 (09:00 ~ 익일 27:00 / 새벽 3시) */
function renderTimelineBlocks(d){
  const fx=fixedFor(d);
  // 09:00 = 540분부터 27:00 = 1620분까지 표시
  return fx.map((f, idx)=>{
    const sMin=parseTimeStr(f.s), eMin=parseTimeStr(f.e);
    const top=(sMin-540)*1.2; // 1분당 1.2px
    const height=Math.max(30, (eMin-sMin)*1.2);
    return `<div class="blk" style="top:${top}px; height:${height}px; left:60px; right:10px;">
     <b>${esc(f.title)}</b> (${f.s}~${f.e})
    </div>`;
  }).join('');
}

/* 12, 13번 요구사항: 항로(projects) 및 세로쓰기 방지 */
function renderProjects(el){
  el.innerHTML=`
    <div class="top">
     <div class="title">항로 (프로젝트) 관리</div>
     <button class="btn primary" onclick="openProjModal()">+ 항로 추가</button>
    </div>
    <div class="card">
     ${S.projects.map(p=>`
       <div class="hbrow" style="background:${p.color||'var(--soft)'}; padding:10px; border-radius:10px; margin-bottom:8px;">
        <span style="font-weight:800">${esc(p.name)}</span>
        <label class="chk"><input type="checkbox" ${p.highlightToday?'checked':''} onchange="toggleProjHL('${p.id}',this.checked)"> 오늘 하이라이트</label>
        <button class="btn danger" onclick="delProj('${p.id}')">삭제</button>
       </div>
     `).join('')||'<div class="empty">등록된 항로가 없습니다.</div>'}
    </div>
  `;
}

function openProjModal(){
  modal('🧭 새 항로 추가', `
    <label>항로 이름 <input type="text" id="pr_name" placeholder="예: 자격증 공부"></label>
    <label>색상 <input type="color" id="pr_color" value="#e1edf0" style="height:40px"></label>
    <button class="btn primary" style="margin-top:10px" onclick="saveProj()">추가</button>
  `,[{t:'닫기',c:'primary'}]);
}

function saveProj(){
  const name=$('#pr_name').value.trim();
  const color=$('#pr_color').value;
  if(!name)return;
  S.projects.push({id:uid(), name, color, highlightToday:false});
  save();
  $('#modal').classList.remove('show');
  render();
}

function toggleProjHL(id, val){
  const p=P(id);if(p){p.highlightToday=val;save();}
}

function delProj(id){
  S.projects=S.projects.filter(p=>p.id!==id);
  save();
  render();
}

function renderWeek(el){
  el.innerHTML=`<div class="top"><div class="title">주간 항해</div></div><div class="card">주간 일정 뷰입니다.</div>`;
}

function renderSettings(el){
  el.innerHTML=`
    <div class="top"><div class="title">설정</div></div>
    <div class="card">
     <label>테마 선택
      <select onchange="S.settings.theme=this.value;save();applyFx()">
       ${Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${S.settings.theme===k?'selected':''}>${v}</option>`).join('')}
      </select>
     </label>
    </div>
  `;
}

function applyFx(){document.body.dataset.theme=S.settings.theme;}

/* 초기실행 */
applyFx();
render();
</script>
</body>
</html>
